name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unzip project
        run: unzip -q SleepCore.zip

      - name: Build debug APK
        working-directory: SleepCore
        run: gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Save build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: SleepCore/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: SleepCore-debug-apk
          path: SleepCore/app/build/outputs/apk/debug/app-debug.apk
